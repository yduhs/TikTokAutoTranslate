name: Build TikTok Auto Translate

on:
  workflow_dispatch:
  push:
    paths:
      - 'TikTok Auto Translate.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -e

          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "Android SDK path: $SDK"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK directory not found: $SDK"
            exit 1
          fi

          echo "Installed SDK packages:"
          ls "$SDK"

      - name: Install Android packages
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK" --install "platform-tools"
          "$SDKMANAGER" --sdk_root="$SDK" --install "platforms;android-35"
          "$SDKMANAGER" --sdk_root="$SDK" --install "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"

          echo "$HOME/gradle-8.6/bin" >> "$GITHUB_PATH"

      - name: Extract project
        run: |
          set -e

          ZIP="TikTok Auto Translate.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP file not found: $ZIP"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          mkdir -p source
          unzip -o "$ZIP" -d source

          echo "Extracted files:"
          find source -maxdepth 4 -type f | head -n 100

          SETTINGS="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found"
            exit 1
          fi

      - name: Build APK
        run: |
          set -e
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokAutoTranslate-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
