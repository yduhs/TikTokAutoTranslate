name: Build TikTok Auto Translate

on:
  workflow_dispatch:
  push:
    paths:
      - 'TikTokAutoTranslate-LSP-Starter.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -e

          echo "Checking Android SDK..."

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK directory not found"
            exit 1
          fi

          echo "Searching for sdkmanager..."

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager
            exit 1
          fi

          echo "Using: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools"

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35"

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d "$HOME"

          echo "$HOME/gradle-8.6/bin" >> "$GITHUB_PATH"

          echo "Gradle installed"

      - name: Extract project
        run: |
          set -e

          mkdir -p source

          unzip -o TikTokAutoTranslate-LSP-Starter.zip -d source

          echo "Searching for settings.gradle..."

          PROJECT_DIR="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle was not found"
            echo "Please check the ZIP file structure."
            find source -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle was not found"
            find "$PROJECT_DIR" -maxdepth 4 -type f
            exit 1
          fi

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -e

          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokAutoTranslate-APK
          path: |
            source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
