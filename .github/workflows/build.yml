name: Build TikTok Auto Translate

on:
  workflow_dispatch:
  push:
    paths:
      - 'TikTokAutoTranslate-LSP-Starter.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35,build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Extract project
        run: |
          unzip -o TikTokAutoTranslate-LSP-Starter.zip -d source
          test -f source/settings.gradle

      - name: Build APK
        run: gradle -p source --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokAutoTranslate-APK
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
