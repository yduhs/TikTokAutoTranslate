
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.autotranslate.tiktok'
    compileSdk 35

    defaultConfig {
        applicationId 'com.autotranslate.tiktok'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }
}

repositories {
    google()
    mavenCentral()
    maven {
        url 'https://api.xposed.info/'
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
